services:

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    ports:
      - 3306:3306

  mbti_express:
    build: ./backend
    image: mbti_express:1.0.0
    container_name: mbti_express
    restart: always
    environment:
      PORT: ${PORT:-5175}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FASTAPI_URL: ${FASTAPI_URL:-http://backend_python:8000}
    secrets:
      - app_env
      - backend_env
    ports:
      - 5175:5175
    depends_on:
      db:
        condition: service_healthy
      backend_python:
        condition: service_started
  
  backend_python:
    build:
      context: ./backend-python
      dockerfile: dockerfile
    image: backend_python:1.0.0
    container_name: backend_python
    restart: always
    ports:
      - 8000:8000
    environment:
      PYTHONUNBUFFERED: "1"
    secrets:
      - app_env
      - backend_python_env
  
  mbti_frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    image: supermarket_frontend:1.0.0
    container_name: supermarket_frontend
    restart: always
    environment:
      PORT: 3000
    ports:
      - 3000:3000
    depends_on:
      - mbti_express

volumes:
  mysql_data:

secrets:
  # These are mounted as files, never injected as container environment vars.
  # The source files are ignored by git and must already exist locally.
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
  app_env:
    file: ./.env
  backend_env:
    file: ./backend/.env
  backend_python_env:
    file: ./backend-python/.env

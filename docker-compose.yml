services:

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root_password)\""]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    ports:
      - 3306:3306

  mbti_express:
    build: ./backend
    image: mbti_express:1.0.0
    container_name: mbti_express
    restart: always
    environment:
      PORT: ${PORT:-5175}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in backend/.env and pass --env-file backend/.env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FASTAPI_URL: ${FASTAPI_URL:-http://backend_python:8000}
    secrets:
      - database_url
      - jwt_secret
      - db_host
      - db_port
      - db_user
      - db_password
      - db_name
    ports:
      - 5175:5175
    depends_on:
      db:
        condition: service_healthy
      backend_python:
        condition: service_started
  
  backend_python:
    build:
      context: ./backend-python
      dockerfile: dockerfile
    image: backend_python:1.0.0
    container_name: backend_python
    restart: always
    ports:
      - 8000:8000
    environment:
      PYTHONUNBUFFERED: "1"
    secrets:
      - gemini_api_key
      - groq_api_key
      - groq_backup_key
  
  mbti_frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        BACKEND_URL: ${BACKEND_URL:-http://mbti_express:5175}
    image: supermarket_frontend:1.0.0
    container_name: supermarket_frontend
    restart: always
    environment:
      PORT: 3000
      BACKEND_URL: http://mbti_express:5175
    ports:
      - 3000:3000
    depends_on:
      - mbti_express

volumes:
  mysql_data:

secrets:
  # These are mounted as individual files, never injected as container
  # environment variables. The generated source files are ignored by git.
  mysql_root_password:
    file: ./.docker-secrets/mysql_root_password
  database_url:
    file: ./.docker-secrets/database_url
  jwt_secret:
    file: ./.docker-secrets/jwt_secret
  db_host:
    file: ./.docker-secrets/db_host
  db_port:
    file: ./.docker-secrets/db_port
  db_user:
    file: ./.docker-secrets/db_user
  db_password:
    file: ./.docker-secrets/db_password
  db_name:
    file: ./.docker-secrets/db_name
  gemini_api_key:
    file: ./.docker-secrets/gemini_api_key
  groq_api_key:
    file: ./.docker-secrets/groq_api_key
  groq_backup_key:
    file: ./.docker-secrets/groq_backup_key

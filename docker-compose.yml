services:

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    ports:
      - 3306:3306

  mbti_express:
    build: ./backend
    image: mbti_express:1.0.0
    container_name: mbti_express
    restart: always
    env_file:
      - ./.env
    ports:
      - 5175:5175
    depends_on:
      db:
        condition: service_healthy
      backend_python:
        condition: service_started
  
  backend_python:
    build:
      context: ./backend-python
      dockerfile: dockerfile
    image: backend_python:1.0.0
    container_name: backend_python
    restart: always
    ports:
      - 8000:8000
    volumes:
      - ./backend-python:/app
  
  mbti_frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    image: supermarket_frontend:1.0.0
    container_name: supermarket_frontend
    restart: always
    env_file:
      - ./.env
    environment:
      PORT: 3000
    ports:
      - 3000:3000
    depends_on:
      - mbti_express

volumes:
  mysql_data:
